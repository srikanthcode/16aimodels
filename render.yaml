services:
  - type: web
    name: hypernet-ai-gateway
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: APP_API_KEY
        sync: false
      - key: HYPERNET_OLLAMA_URL
        sync: false
      - key: HYPERNET_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: UPSTREAM_TIMEOUT_MS
        value: "570000"
      - key: UPSTREAM_WARMUP_TIMEOUT_MS
        value: "2700000"
